name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.20"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test with coverage
        run: uv run pytest --cov=ml_template --cov-report=term-missing --cov-fail-under=90

      - name: Dependency security audit
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file /tmp/ml-template-requirements.txt
          uv run pip-audit -r /tmp/ml-template-requirements.txt
