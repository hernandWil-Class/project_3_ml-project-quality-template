[project]
name = "ml-project-quality-template"
version = "0.1.0"
description = "A small typed synthetic ML package for learning repository quality practices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.8,<5.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_template"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ml_template"]

[tool.coverage.report]
fail_under = 90
show_missing = true
